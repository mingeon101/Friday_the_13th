<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13일의 금요일 · BLACK PINE</title><link rel="stylesheet" href="./style.css"></head><body><header><span id="account"></span><button id="login-open" class="ghost">로그인</button><button id="sound">소리 켜기</button><button id="exit" hidden>나가기</button></header><section id="splash"><div class="moon"></div><div class="splash-card"><p class="label">BLACK PINE</p><h1>13일의 금요일</h1><p class="subtitle">THE LAST NIGHT</p><button id="enter-game" disabled>시작하기</button></div></section><main id="game-screen" hidden><canvas id="game" aria-label="3D 캠프 생존 게임"></canvas><div id="crosshair">+</div><section id="quest" class="hud"><span class="label">QUEST</span><h2 id="quest-title">탈출 준비</h2><p id="quest-text">부품 3개를 찾아 차량으로 돌아가세요.</p></section><section id="inventory" class="hud"><span class="label">INVENTORY</span><div class="slots"><div class="item" id="i0">◇ 자동차 열쇠</div><div class="item" id="i1">◇ 연료통</div><div class="item" id="i2">◇ 배터리</div></div></section><div id="room-hud" class="hud" hidden><span id="room-code"></span><span id="room-count"></span><ul id="players-list"></ul></div><canvas id="minimap" width="180" height="144" aria-label="미니맵"></canvas><section id="vitals"><span id="difficulty-label">EASY</span><span id="threat-count">1 명</span> · <span id="night-time">0:00</span> · <span id="status">탐색 대기</span><div class="bar"><i id="stamina"></i></div><p id="notice" role="status"></p></section><div id="help">WASD 이동 · 화면 클릭 후 마우스 시점 · Esc 커서 해제 · Shift 달리기 · E 상호작용 · P 정지</div><button id="resume" hidden>계속</button><div class="controls"><button data-key="arrowleft">◀</button><button data-key="arrowup">▲</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button><button data-key="shift">달리기</button><button id="hide">상호작용</button></div><div id="overlay"><div class="menu"><span class="label">BLACK PINE / 3D</span><h2 id="title">캠프 입장</h2><p id="desc">혼자 또는 친구와 함께 살아남으세요.</p><fieldset class="difficulty" aria-label="난이도"><label><input type="radio" name="difficulty" value="easy" checked> Easy</label><label><input type="radio" name="difficulty" value="hard"> Hard</label></fieldset><button id="start">혼자 시작</button><div class="separator">MULTIPLAYER · 최대 4명</div><button id="create-room" class="ghost">방 만들기</button><div class="join"><input id="join-code" maxlength="6" placeholder="방 코드 6자리" aria-label="방 코드" autocomplete="off"><button id="join-room" class="ghost">입장</button></div><div id="lobby" hidden><p id="lobby-code"></p><p id="lobby-players"></p><button id="room-start">함께 시작</button><button id="leave-room" class="ghost">방 나가기</button></div><p id="network-error" role="alert"></p></div></div></main><dialog id="auth-dialog" aria-labelledby="auth-title"><button class="close secondary" id="auth-close" aria-label="닫기">✕</button><h2 id="auth-title">로그인</h2><form id="auth-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><div class="auth-tabs"><button id="email-login" type="submit">로그인</button><button id="email-signup" class="secondary" type="button">회원가입</button></div></form><button id="google-login" class="secondary">Google로 계속하기</button><p class="auth-error" id="auth-error" role="alert"></p><button id="guest" class="secondary">게스트로 플레이</button></dialog><script type="module" src="./auth.js"></script><script type="module" src="./game.js"></script></body></html>
